name: Developer Log

permissions:
  contents: write

concurrency:
  group: developer-log
  cancel-in-progress: false

on:
  schedule:
    # Twice per day: 09:00 and 21:00 UTC
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  log:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Generate developer log entry
      - name: Generate developer log entry
        run: |
          # Generate a timestamp for the log entry
          DATE=$(date -u +"%Y-%m-%d")
          HOUR=$(date -u +"%H")
          MINUTE=$(date -u +"%M")

          TIME=$(printf "%02d:%02d UTC" "$HOUR" "$MINUTE")

          MESSAGES=(
            "Worked on personal tooling and automation."
            "Reviewed GitHub Actions workflows."
            "Improved repository maintenance tasks."
            "Experimented with CI/CD automation."
            "Refined developer workflow."
            "Worked on software development projects."
            "Improved project documentation and configuration."
            "Reviewed and optimized development workflows."
          )

          MESSAGE=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}

          # Append instead of overwrite
          echo "- **$DATE ($TIME)** — $MESSAGE" >> daily-log.md

      # 3. Configure Git
      - name: Configure Git
        run: |
          git config user.name "Abre-Bridge"
          git config user.email "abrebridge2628@gmail.com"

      # 4. Commit and push
      - name: Commit and push
        run: |
          git add daily-log.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "docs: update developer log"

          git pull --rebase origin main

          git push origin main
